
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion bibliothèque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            font-family: 'Segoe UI', Verdana, sans-serif;
            color: #111827;
            background: #f8fafc;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.14), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.12), transparent 30%),
                        linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
        }

        .login-page {
            width: min(100%, 420px);
        }

        .login-card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
            padding: 2rem;
        }

        .login-card::before,
        .login-card::after {
            content: '';
            position: absolute;
            border-radius: 999px;
            opacity: 0.55;
        }

        .login-card::before {
            width: 200px;
            height: 200px;
            top: -70px;
            right: -70px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.36) 0%, transparent 60%);
        }

        .login-card::after {
            width: 160px;
            height: 160px;
            bottom: -60px;
            left: -50px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, transparent 55%);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .brand h1 {
            font-size: clamp(2rem, 2.3vw, 2.4rem);
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .brand p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 1.3rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            color: #334155;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 16px;
            border: 1px solid #d1d5db;
            background: #f8fafc;
            color: #111827;
            font-size: 0.98rem;
            transition: border-color 0.22s ease, box-shadow 0.22s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 0.95rem 1rem;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 30px rgba(59, 130, 246, 0.18);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 36px rgba(59, 130, 246, 0.22);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .aux-link {
            margin-top: 1.25rem;
            text-align: center;
            color: #64748b;
            font-size: 0.92rem;
        }

        .error {
            margin-bottom: 1rem;
            padding: 0.95rem 1rem;
            border-radius: 16px;
            border: 1px solid #fca5a5;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 0.95rem;
        }

        @media (max-width: 520px) {
            .login-card {
                padding: 1.5rem;
            }

            .brand h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <h1>Bienvenue</h1>
                <p>Connectez-vous pour accéder à votre bibliothèque et consulter vos livres.</p>
            </div>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="post" action="/login">
                <div class="form-group">
                    <label for="Username">Nom d'utilisateur</label>
                    <input id="Username" type="text" name="username" placeholder="Entrez votre nom d'utilisateur" required>
                </div>

                <div class="form-group">
                    <label for="Password">Mot de passe</label>
                    <input id="Password" type="password" name="pass_word" placeholder="Entrez votre mot de passe" required>
                </div>

                <button type="submit" class="submit-btn">Se connecter</button>
            </form>
        </section>
    </main>
</body>
</html>
